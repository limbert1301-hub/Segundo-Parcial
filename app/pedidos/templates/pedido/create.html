{% extends "base.html" %}
{% block content %}
<div style="background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto;">
    <h2>Registrar Pedido</h2>
    <form method="POST" style="display: flex; flex-direction: column; gap: 12px;">
        <label>Fecha:</label>
        <input type="text" name="fecha" placeholder="Ej: 2026-11-03" required style="padding: 8px;">
        <label>Monto:</label>
        <input type="number" step="0.01" name="monto" required style="padding: 8px;">
        
        <label>Cliente:</label>
        <select name="cliente_id" required style="padding: 8px;">
            {% for c in clientes %}
            <option value="{{ c.id }}">{{ c.nombre }}</option>
            {% endfor %}
        </select>

        <label>Producto:</label>
        <select name="producto_id" required style="padding: 8px;">
            {% for p in productos %}
            <option value="{{ p.id }}">{{ p.nombre }}</option>
            {% endfor %}
        </select>

        <button type="submit" style="background: #16a34a; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Guardar</button>
    </form>
    <br>
    <a href="{{ url_for('bp_pedidos.index') }}" style="color: #64748b; text-decoration: none;">Cancelar</a>
</div>
{% endblock %}
