{% extends "base.html" %}
{% block content %}
<div style="background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto;">
    <h2>Registrar Cliente</h2>
    <form method="POST" style="display: flex; flex-direction: column; gap: 12px;">
        <label>Nombre:</label>
        <input type="text" name="nombre" required style="padding: 8px;">
        <label>Teléfono:</label>
        <input type="text" name="telefono" required style="padding: 8px;">
        <button type="submit" style="background: #16a34a; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Guardar</button>
    </form>
</div>
{% endblock %}
