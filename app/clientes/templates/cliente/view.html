{% extends "base.html" %}
{% block content %}
<div style="background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto;">
    <h2>Detalle del Cliente</h2>
    <p><strong>ID:</strong> {{ cliente.id }}</p>
    <p><strong>Nombre:</strong> {{ cliente.nombre }}</p>
    <p><strong>Teléfono:</strong> {{ cliente.telefono }}</p>
    <a href="{{ url_for('bp_clientes.index') }}" style="background: #64748b; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; display: inline-block; margin-top: 10px;">Volver</a>
</div>
{% endblock %}
