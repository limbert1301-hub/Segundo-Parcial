{% extends "base.html" %}
{% block content %}
<div style="background: white; padding: 20px; border-radius: 8px;">
    <h2>Listado de Clientes</h2>
    <a href="{{ url_for('bp_clientes.create') }}" style="background: #2563eb; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; display: inline-block; margin-bottom: 15px;">+ Nuevo Cliente</a>
    <table style="width: 100%; border-collapse: collapse;">
        <tr style="background: #e2e8f0; text-align: left;">
            <th style="padding: 10px;">ID</th>
            <th style="padding: 10px;">Nombre</th>
            <th style="padding: 10px;">Teléfono</th>
            <th style="padding: 10px;">Acciones</th>
        </tr>
        {% for c in clientes %}
        <tr style="border-bottom: 1px solid #cbd5e1;">
            <td style="padding: 10px;">{{ c.id }}</td>
            <td style="padding: 10px;">{{ c.nombre }}</td>
            <td style="padding: 10px;">{{ c.telefono }}</td>
            <td style="padding: 10px; display: flex; gap: 10px;">
                <a href="{{ url_for('bp_clientes.view', id=c.id) }}" style="color: #2563eb; text-decoration: none; font-weight: bold;">Ver</a>
                <a href="{{ url_for('bp_clientes.edit', id=c.id) }}" style="color: #d97706; text-decoration: none; font-weight: bold;">Editar</a>
                <a href="{{ url_for('bp_clientes.delete', id=c.id) }}" style="color: #dc2626; text-decoration: none; font-weight: bold;">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
