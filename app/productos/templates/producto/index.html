{% extends "base.html" %}
{% block content %}
<div style="background: white; padding: 20px; border-radius: 8px;">
    <h2>Listado de Productos</h2>
    <a href="{{ url_for('bp_productos.create') }}" style="background: #2563eb; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; display: inline-block; margin-bottom: 15px;">+ Nuevo Producto</a>
    <table style="width: 100%; border-collapse: collapse;">
        <tr style="background: #e2e8f0; text-align: left;">
            <th style="padding: 10px;">ID</th>
            <th style="padding: 10px;">Nombre</th>
            <th style="padding: 10px;">Precio</th>
            <th style="padding: 10px;">Stock</th>
            <th style="padding: 10px;">Acciones</th>
        </tr>
        {% for p in productos %}
        <tr style="border-bottom: 1px solid #cbd5e1;">
            <td style="padding: 10px;">{{ p.id }}</td>
            <td style="padding: 10px;">{{ p.nombre }}</td>
            <td style="padding: 10px;">${{ p.precio }}</td>
            <td style="padding: 10px;">{{ p.stock }}</td>
            <td style="padding: 10px; display: flex; gap: 10px;">
                <a href="{{ url_for('bp_productos.view', id=p.id) }}" style="color: #2563eb; text-decoration: none; font-weight: bold;">Ver</a>
                <a href="{{ url_for('bp_productos.edit', id=p.id) }}" style="color: #d97706; text-decoration: none; font-weight: bold;">Editar</a>
                <a href="{{ url_for('bp_productos.delete', id=p.id) }}" style="color: #dc2626; text-decoration: none; font-weight: bold;">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
