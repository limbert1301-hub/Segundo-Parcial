{% extends "base.html" %}
{% block content %}
<div style="background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto;">
    <h2>Registrar Producto</h2>
    <form method="POST" style="display: flex; flex-direction: column; gap: 12px;">
        <label>Nombre:</label>
        <input type="text" name="nombre" required style="padding: 8px;">
        <label>Precio:</label>
        <input type="number" step="0.01" name="precio" required style="padding: 8px;">
        <label>Stock:</label>
        <input type="number" name="stock" required style="padding: 8px;">
        <button type="submit" style="background: #16a34a; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Guardar</button>
    </form>
    <br>
    <a href="{{ url_for('bp_productos.index') }}" style="color: #64748b; text-decoration: none;">Cancelar</a>
</div>
{% endblock %}
